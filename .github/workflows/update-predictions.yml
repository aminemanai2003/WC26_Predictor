name: Update predictions

on:
  workflow_dispatch:
  schedule:
    - cron: "20 */2 * * *"

permissions:
  contents: write

concurrency:
  group: update-predictions
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/update_predictions.py
      - name: Commit refreshed artifacts
        run: |
          git config user.name "wc26-update-bot"
          git config user.email "actions@users.noreply.github.com"
          git add artifacts web/public/data notebook/wc2026_pipeline.ipynb
          git diff --cached --quiet || git commit -m "Refresh predictions with latest results"
          git push
