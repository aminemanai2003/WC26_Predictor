name: Update predictions

on:
  workflow_dispatch:
  schedule:
    - cron: "20 */2 * * *"

permissions:
  contents: write

concurrency:
  group: update-predictions
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/update_predictions.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Commit refreshed artifacts
        run: |
          # Vercel authorizes deployments from this private repository by the
          # GitHub identity attached to the commit. The generic Actions address
          # is attributed to github/actions and is blocked by the Hobby project.
          git config user.name "aminemanai2003"
          git config user.email "amine.manai@esprit.tn"
          git add artifacts web/public/data notebook/wc2026_pipeline.ipynb
          git diff --cached --quiet || git commit -m "Refresh predictions with latest results"
          git push
